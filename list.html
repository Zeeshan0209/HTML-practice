<!--
there are two type of list 
1:- Unordered list
2:- Ordered list 
-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML </title>
 </head>
 <body>
    <!-- Example of unordered list -->
       <ul>
        <li>bread</li>
        <li>samosa</li>
        <li>milk</li>
       </ul>
       <!-- Example of ordered list -->
       <ol>
        <li>bread</li>
        <li>samosa</li>
        <li>milk</li>
       </ol>
    <ol type="a">
        <li>bread</li>
        <li>samosa</li>
        <li>milk</li>
       </ol>
    <ol type="i">
        <li>bread</li>
        <li>samosa</li>
        <li>milk</li>
       </ol>
    
    </body>
 </html>
