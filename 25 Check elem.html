<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check input element</title>
</head>
<body>
    <form action="/sever">
        <input type="checkbox" id="check" name="age" value="eligible">
        <label for="check">i am 18+</label>
        <hr>
        <div>
             <label for="math">math</label>
             <input type="checkbox" id="math" name="sub" value="math">

             <label for="english">english</label>
             <input type="checkbox" id="english" name="sub" value="eng">
        </div>
        <button><b>submit</b></button>
    </form>
</body>
</html>
