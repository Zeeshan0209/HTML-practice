<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Attributes</title>
</head>
<body>
    <table border="black">
        <caption><b>Food Menu</b></caption>
        <thead>
            <tr>
                <th rowspan="2">Items</th>
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>IND</th>
                <th>USD</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>samosa</td>
                <td>10</td>
                <td>0.14</td>
            </tr>
            <tr>
                <td>chips</td>
                <td>20</td>
                <td>0.25</td>
            </tr>
            <tr>
                <td>frooti</td>
                <td>15</td>
                <td>0.17</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
